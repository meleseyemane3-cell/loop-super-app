<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>LOOP Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080d16;
      --card: #111827;
      --input: #1f2937;
      --border: #374151;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #4ade80;
      --blue: #3b82f6;
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #facc15;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans Ethiopic", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .title {
      margin: 10px 0 15px;
      color: var(--green);
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    .status {
      min-height: 20px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--card);
      border: 1px solid #1f2937;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }

    h2,
    h3 {
      margin-top: 0;
    }

    h2 {
      color: var(--green);
      font-size: 20px;
    }

    h3 {
      color: #60a5fa;
      font-size: 18px;
    }

    input,
    textarea {
      width: 100%;
      margin: 6px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font-size: 15px;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--green);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .blue {
      background: var(--blue);
    }

    .green {
      background: #10b981;
    }

    .red {
      background: var(--red);
    }

    .orange {
      background: var(--orange);
    }

    .hidden {
      display: none !important;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .message {
      min-height: 22px;
      margin-top: 10px;
      color: var(--green);
      font-size: 14px;
      line-height: 1.55;
    }

    .message.error {
      color: #f87171;
    }

    .user-email {
      color: var(--green);
      overflow-wrap: anywhere;
    }

    .post {
      margin-bottom: 12px;
      padding: 14px;
      background: #0f172a;
      border: 1px solid #263244;
      border-radius: 12px;
    }

    .post-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .post-media {
      display: block;
      width: 100%;
      max-height: 400px;
      margin-top: 12px;
      border-radius: 10px;
      background: #020617;
      object-fit: contain;
    }

    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid #334155;
      color: var(--muted);
      font-size: 11px;
    }

    .like-btn {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      background: #1e293b;
      border: 1px solid #475569;
      font-size: 12px;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    .live-box {
      margin-top: 12px;
      padding: 12px;
      background: #1e293b;
      border-radius: 10px;
      color: var(--yellow);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 430px) {
      .app {
        padding: 10px;
      }

      .auth-grid {
        grid-template-columns: 1fr;
      }

      .post-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="title">👥 LOOP Family</div>

    <div id="realtime-status" class="status">
      Realtime በመገናኘት ላይ...
    </div>

    <!-- Authentication -->
    <section class="card">
      <h3>🔐 Login / Sign Up</h3>

      <div id="login-form">
        <input
          id="email"
          type="email"
          placeholder="Email"
          autocomplete="email"
        />

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />

        <div class="auth-grid">
          <button id="login-btn" class="blue" type="button">
            ግባ
          </button>

          <button id="signup-btn" class="green" type="button">
            አካውንት ክፈት
          </button>
        </div>

        <div id="auth-message" class="message"></div>
      </div>

      <div id="logged-user" class="hidden">
        <div>
          ገብተሃል:
          <span id="user-email" class="user-email"></span>
        </div>

        <button id="logout-btn" class="red" type="button">
          ውጣ
        </button>
      </div>
    </section>

    <!-- Only logged-in users can see this area -->
    <section id="family-area" class="card hidden">
      <h2>LOOP Family እንቅስቃሴ</h2>

      <textarea
        id="post-content"
        placeholder="ምን እያሰብክ ነው?"
      ></textarea>

      <input
        id="media-file"
        type="file"
        accept="image/*,video/*"
      />

      <button id="post-btn" class="blue" type="button">
        ፖስት አድርግ
      </button>

      <button id="live-btn" class="orange" type="button">
        🔴 Live ጀምር
      </button>

      <div id="family-message" class="message"></div>

      <div id="live-area" class="live-box hidden">
        ✅ Login ተረጋግጧል።<br />
        Live ለመጀመር የcamera እና streaming ክፍል ይጨመራል።
      </div>
    </section>

    <!-- Everyone can read posts -->
    <section class="card">
      <h3>📰 LOOP Family Posts</h3>

      <div id="posts-list">
        <div class="empty">
          ፖስቶች በመጫን ላይ...
        </div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      'https://chmwdtxktrezasgbbvjr.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_QQAtpXYe2IQqmvpFrRyBXg_GWpnnQqc';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    const loginForm =
      document.getElementById('login-form');

    const loggedUser =
      document.getElementById('logged-user');

    const familyArea =
      document.getElementById('family-area');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const authMessage =
      document.getElementById('auth-message');

    const familyMessage =
      document.getElementById('family-message');

    const userEmail =
      document.getElementById('user-email');

    const postContent =
      document.getElementById('post-content');

    const mediaFile =
      document.getElementById('media-file');

    const postsList =
      document.getElementById('posts-list');

    const realtimeStatus =
      document.getElementById('realtime-status');

    const liveArea =
      document.getElementById('live-area');

    function showMessage(element, text, error = false) {
      element.textContent = text;
      element.className = error
        ? 'message error'
        : 'message';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };

        return map[char];
      });
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);

        if (url.protocol !== 'https:') {
          return '';
        }

        return escapeHtml(url.href);
      } catch {
        return '';
      }
    }

    function showLoggedIn(user) {
      loginForm.classList.add('hidden');
      loggedUser.classList.remove('hidden');
      familyArea.classList.remove('hidden');

      userEmail.textContent =
        user.email || 'Authenticated user';
    }

    function showLoggedOut() {
      loginForm.classList.remove('hidden');
      loggedUser.classList.add('hidden');
      familyArea.classList.add('hidden');
      liveArea.classList.add('hidden');
      userEmail.textContent = '';
    }

    async function updateAuthUI() {
      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        showLoggedOut();
        return;
      }

      if (session?.user) {
        showLoggedIn(session.user);
      } else {
        showLoggedOut();
      }
    }

    async function loginUser() {
      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage(
          authMessage,
          'Email እና Password ይሙሉ።',
          true
        );
        return;
      }

      const button =
        document.getElementById('login-btn');

      button.disabled = true;
      showMessage(
        authMessage,
        'በመግባት ላይ...'
      );

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      button.disabled = false;

      if (error) {
        showMessage(
          authMessage,
          'Login አልተሳካም: ' + error.message,
          true
        );
        return;
      }

      showLoggedIn(data.user);

      showMessage(
        authMessage,
        '✅ Login ተሳክቷል።'
      );
    }

    async function signupUser() {
      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage(
          authMessage,
          'Email እና Password ይሙሉ።',
          true
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          authMessage,
          'Password ቢያንስ 6 ቁምፊ ይሁን።',
          true
        );
        return;
      }

      const button =
        document.getElementById('signup-btn');

      button.disabled = true;
      showMessage(
        authMessage,
        'አካውንት በመፍጠር ላይ...'
      );

      const {
        data,
        error
      } = await supabaseClient.auth.signUp({
        email,
        password
      });

      button.disabled = false;

      if (error) {
        showMessage(
          authMessage,
          'ምዝገባ አልተሳካም: ' + error.message,
          true
        );
        return;
      }

      if (data.session && data.user) {
        showLoggedIn(data.user);

        showMessage(
          authMessage,
          '✅ አካውንት ተፈጥሯል።'
        );
      } else {
        showMessage(
          authMessage,
          '✅ ምዝገባ ተሳክቷል። Email አረጋግጥና Login አድርግ።'
        );
      }
    }

    async function logoutUser() {
      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {
        showMessage(
          authMessage,
          'Logout አልተሳካም: ' + error.message,
          true
        );
        return;
      }

      showLoggedOut();

      showMessage(
        authMessage,
        'ከአካውንትህ ወጥተሃል።'
      );
    }

    async function uploadMedia(file) {
      const cleanName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          '_'
        );

      const random =
        Math.random()
          .toString(36)
          .slice(2);

      const path =
        `${Date.now()}_${random}_${cleanName}`;

      const {
        error
      } = await supabaseClient.storage
        .from('post-media')
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        });

      if (error) {
        throw error;
      }

      const {
        data
      } = supabaseClient.storage
        .from('post-media')
        .getPublicUrl(path);

      if (!data?.publicUrl) {
        throw new Error(
          'Media URL አልተፈጠረም።'
        );
      }

      return data.publicUrl;
    }

    function renderMedia(post) {
      if (!post.media_url) {
        return '';
      }

      const url =
        safeUrl(post.media_url);

      if (!url) {
        return '';
      }

      if (post.media_type === 'video') {
        return `
          <video
            class="post-media"
            src="${url}"
            controls
            preload="metadata"
          ></video>
        `;
      }

      return `
        <img
          class="post-media"
          src="${url}"
          alt="LOOP Family media"
          loading="lazy"
        />
      `;
    }

    async function createPost() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        showMessage(
          familyMessage,
          'ፖስት ለማድረግ Login አድርግ።',
          true
        );
        showLoggedOut();
        return;
      }

      const content =
        postContent.value.trim();

      const file =
        mediaFile.files?.[0] || null;

      if (!content && !file) {
        showMessage(
          familyMessage,
          'ጽሁፍ ወይም ፎቶ/ቪዲዮ አስገባ።',
          true
        );
        return;
      }

      if (
        file &&
        file.size > 20 * 1024 * 1024
      ) {
        showMessage(
          familyMessage,
          'ፋይሉ ከ20MB መብለጥ የለበትም።',
          true
        );
        return;
      }

      const button =
        document.getElementById('post-btn');

      button.disabled = true;
      button.textContent = 'በመላክ ላይ...';

      try {
        let mediaUrl = null;
        let mediaType = null;

        if (file) {
          mediaUrl = await uploadMedia(file);

          mediaType =
            file.type.startsWith('video/')
              ? 'video'
              : 'image';
        }

        const {
          error
        } = await supabaseClient
          .from('posts')
          .insert({
            user_id: user.id,
            content,
            media_url: mediaUrl,
            media_type: mediaType,
            likes: 0
          });

        if (error) {
          throw error;
        }

        postContent.value = '';
        mediaFile.value = '';

        showMessage(
          familyMessage,
          '✅ ፖስት ተልኳል።'
        );

        await loadPosts();

      } catch (error) {
        console.error(error);

        showMessage(
          familyMessage,
          'ፖስት አልተላከም: ' + error.message,
          true
        );
      } finally {
        button.disabled = false;
        button.textContent = 'ፖስት አድርግ';
      }
    }

    async function startLive() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        showMessage(
          familyMessage,
          'Live ለመጀመር Login አድርግ።',
          true
        );
        showLoggedOut();
        return;
      }

      liveArea.classList.remove('hidden');

      showMessage(
        familyMessage,
        '✅ Live ለመጀመር ተፈቅዷል።'
      );
    }

    async function loadPosts() {
      const {
        data,
        error
      } = await supabaseClient
        .from('posts')
        .select(
          'id, user_id, content, media_url, media_type, likes, created_at'
        )
        .order('created_at', {
          ascending: false
        });

      if (error) {
        postsList.innerHTML = `
          <div class="empty">
            ፖስቶችን ማምጣት አልተቻለም።<br />
            ${escapeHtml(error.message)}
          </div>
        `;
        return;
      }

      postsList.innerHTML = '';

      if (!data || data.length === 0) {
        postsList.innerHTML = `
          <div class="empty">
            እስካሁን ምንም ፖስት የለም።
          </div>
        `;
        return;
      }

      data.forEach(post => {
        const element =
          document.createElement('article');

        element.className = 'post';

        element.innerHTML = `
          <div class="post-text">
            ${escapeHtml(post.content || '')}
          </div>

          ${renderMedia(post)}

          <div class="post-footer">
            <span>
              ${new Date(post.created_at)
                .toLocaleString('am-ET')}
            </span>

            <button
              class="like-btn"
              type="button"
              data-id="${post.id}"
            >
              ❤️ ${Number(post.likes || 0)}
            </button>
          </div>
        `;

        postsList.appendChild(element);
      });

      document
        .querySelectorAll('.like-btn')
        .forEach(button => {
          button.addEventListener(
            'click',
            () => likePost(
              Number(button.dataset.id)
            )
          );
        });
    }

    async function likePost(postId) {
      const {
        data: post,
        error: readError
      } = await supabaseClient
        .from('posts')
        .select('likes')
        .eq('id', postId)
        .single();

      if (readError) {
        console.error(readError);
        return;
      }

      const {
        error
      } = await supabaseClient
        .from('posts')
        .update({
          likes: Number(post.likes || 0) + 1
        })
        .eq('id', postId);

      if (error) {
        console.error(error);
        return;
      }

      await loadPosts();
    }

    function setupRealtime() {
      supabaseClient
        .channel('loop-family-posts')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'posts'
          },
          payload => {
            console.log(
              'Realtime update:',
              payload
            );

            loadPosts();
          }
        )
        .subscribe(status => {
          console.log(
            'Realtime status:',
            status
          );

          if (status === 'SUBSCRIBED') {
            realtimeStatus.textContent =
              '✅ Realtime ተገናኝቷል።';

            realtimeStatus.style.color =
              '#4ade80';
          } else if (status === 'CHANNEL_ERROR') {
            realtimeStatus.textContent =
              '❌ Realtime ስህተት።';

            realtimeStatus.style.color =
              '#f87171';
          }
        });
    }

    document
      .getElementById('login-btn')
      .addEventListener(
        'click',
        loginUser
      );

    document
      .getElementById('signup-btn')
      .addEventListener(
        'click',
        signupUser
      );

    document
      .getElementById('logout-btn')
      .addEventListener(
        'click',
        logoutUser
      );

    document
      .getElementById('post-btn')
      .addEventListener(
        'click',
        createPost
      );

    document
      .getElementById('live-btn')
      .addEventListener(
        'click',
        startLive
      );

    supabaseClient.auth.onAuthStateChange(
      (_event, session) => {
        if (session?.user) {
          showLoggedIn(session.user);
        } else {
          showLoggedOut();
        }
      }
    );

    async function startApp() {
      await updateAuthUI();
      await loadPosts();
      setupRealtime();
    }

    startApp();
  </script>
</body>
</html>
