<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP Super App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.7rem;
            color: #ffffff;
            font-weight: 800;
        }

        header p {
            font-size: 0.8rem;
            color: #8a99ad;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Grid Services Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .service-card {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-card:hover {
            border-color: #ff6b00;
            background-color: #1a233a;
        }

        .service-card .icon {
            font-size: 1.5rem;
        }

        .service-card span {
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
        }

        /* LOOP Family / Social & Monetization Section */
        .social-box {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ff6b00;
        }

        .monetize-badge {
            background: rgba(255, 107, 0, 0.15);
            color: #ff6b00;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .post-textarea {
            width: 100%;
            background-color: #080c14;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 10px;
            color: #ffffff;
            font-size: 0.85rem;
            resize: none;
            height: 80px;
            outline: none;
        }

        .post-textarea:focus {
            border-color: #ff6b00;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            background-color: #080c14;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 9px 4px;
            color: #94a3b8;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #1f293d;
            color: #ffffff;
        }

        .submit-post-btn {
            width: 100%;
            background: linear-gradient(135deg, #cc3300, #ff6b00);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Feed Display Area */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .feed-item {
            background: #080c14;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .feed-user {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ff6b00;
        }

        .feed-text {
            font-size: 0.82rem;
            color: #e2e8f0;
        }

        .feed-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8a99ad;
        }

        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }
        .modal-content {
            background: #111827;
            border: 1px solid #ff6b00;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            color: #ff6b00;
        }
        .close-btn {
            background: none; border: none; color: #8a99ad; font-size: 1.2rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>LOOP Super App</h1>
            <p>Connect • Discover • Communicate • Pay</p>
        </header>

        <!-- Services Grid Dashboard -->
        <div class="dashboard-grid">
            <div class="service-card" onclick="openModule('LOOP ቱሪዝም (Tourism & Booking)', 'ኢትዮጵያ ውስጥ የሚገኙ አስደናቂ መስህቦች፣ ሆቴሎች እና የትራንስፖርት ቡኪንግ ስርዓት ከእያንዳንዱ ማብራሪያ ጋር።')">
                <div class="icon">✈️</div>
                <span>LOOP ቱሪዝም</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ስፖርት (Live Match & Scores)', 'የእግር ኳስ ላይቭ ጨዋታዎች፣ ውጤቶች እና ሊግ ሰንጠረዦች በዘመናዊ መልኩ።')">
                <div class="icon">⚽</div>
                <span>ስፖርት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ቻት (AI Translation & Chat)', 'የኢሞ እና ዋትስአፕ ባህሪያት የተሟሉበት፣ በ AI ትርጉም የሚታገዝ አለም አቀፍ የውይይት ማዕቀፍ።')">
                <div class="icon">💬</div>
                <span>ቻት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP AI ረዳት (Smart Assistant)', 'ለማንኛውም ፍላጎትዎ ፈጣን ምላሽ የሚሰጥ እና አፕሊኬሽኑን የሚያስተባብር ስማርት ረዳት።')">
                <div class="icon">🤖</div>
                <span>AI ረዳት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ዜና (Multi-sector News)', 'ወቅታዊ ሀገራዊ እና ዓለም አቀፋዊ ባለብዙ ዘርፍ ዜናዎች።')">
                <div class="icon">📖</div>
                <span>ዜና</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP አየር ሁኔታ (Weather)', 'የተለያዩ ከተሞች የአየር ሁኔታ ትንበያ እና ወቅታዊ መረጃዎች።')">
                <div class="icon">🌤️</div>
                <span>አየር ሁኔታ</span>
            </div>
        </div>

        <!-- LOOP Family Social & Monetization Section -->
        <div class="social-box">
            <div class="social-header">
                <span>👥 LOOP Family (Social & Earn)</span>
                <span class="monetize-badge">💰 ገቢ ማስገኛ</span>
            </div>
            <textarea class="post-textarea" id="postInput" placeholder="ምን እየተሰማዎት ነው? (TikTok/FB style post & earn...)"></textarea>
            <div class="post-actions">
                <button class="action-btn" onclick="alert('ቲክቶክ/ፌስቡክ ቪዲዮ እና ፎቶ መጫኛ ተከፍቷል!')">📷 ቪዲዮ/ፎቶ</button>
                <button class="action-btn" onclick="alert('የድምጽ ስቱዲዮ እና ላይቭ ስትሪም ተከፍቷል!')">🎙️ ላይቭ/ድምጽ</button>
            </div>
            <button class="submit-post-btn" onclick="submitPost()">ሀሳብ ልቀቅ & ገቢ አግኝ</button>

            <!-- Live Post Feed Container -->
            <div class="feed-container" id="feedContainer">
                <div class="feed-item">
                    <div class="feed-user">መለሰ ይማነ (Developer)</div>
                    <div class="feed-text">እንኳን ወደ LOOP Super App በደህና መጡ! አዲሱ የሶሻል እና የገቢ ማስገኛ ስርዓታችን ተጀምሯል። 🚀</div>
                    <div class="feed-footer">
                        <span>❤️ 24 አድናቆት</span>
                        <span>💬 5 አስተያየት</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Module Popup View -->
    <div class="modal" id="moduleModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">ማዕቀፍ</span>
                <button class="close-btn" onclick="closeModule()">✕</button>
            </div>
            <p id="modalDesc" style="color: #94a3b8; font-size: 0.88rem; line-height: 1.5;"></p>
            <button class="submit-post-btn" onclick="closeModule()">ተመለስ</button>
        </div>
    </div>

    <script>
        function openModule(name, desc) {
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('moduleModal').style.display = 'flex';
        }
        function closeModule() {
            document.getElementById('moduleModal').style.display = 'none';
        }
        function submitPost() {
            const val = document.getElementById('postInput').value.trim();
            if(!val) {
                alert('እባክዎ የሚለቁትን ሀሳብ ይጻፉ!');
                return;
            }
            
            // Add post dynamically to feed container
            const feedContainer = document.getElementById('feedContainer');
            const newPost = document.createElement('div');
            newPost.className = 'feed-item';
            newPost.innerHTML = `
                <div class="feed-user">ተጠቃሚ (LOOP Member)</div>
                <div class="feed-text">${val}</div>
                <div class="feed-footer">
                    <span>❤️ 1 አድናቆት</span>
                    <span>💬 0 አስተያየት</span>
                </div>
            `;
            feedContainer.prepend(newPost);
            
            alert('ሀሳብዎ ተለቆ በ LOOP Family ተሳክቷል! (የገቢ ቦርሳዎ ተዘምኗል 💰)');
            document.getElementById('postInput').value = '';
        }
    </script>
</body>
</html>
