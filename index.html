<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP Super App</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #1e293b;
        }
        header {
            padding: 18px 20px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            letter-spacing: 0.5px;
        }
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 30px;
        }
        /* Features Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .feature-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .feature-btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .feature-btn span {
            font-size: 18px;
        }
        /* Wallet/Profile Bar */
        .wallet-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .balance-badge {
            background: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .phone-num {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }
        .add-card-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        /* LOOP Family Post Box */
        .post-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .post-box-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .post-box textarea {
            width: 100%;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            resize: none;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .post-box textarea:focus {
            border-color: #38bdf8;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .action-chip {
            background: #0f172a;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .action-chip:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }
        .submit-post-btn {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .submit-post-btn:hover {
            background: #0369a1;
        }
        /* Feed Cards */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card p {
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-word;
            color: #f8fafc;
            line-height: 1.5;
        }
        .card img, .card video, .card audio {
            width: 100%;
            border-radius: 8px;
            max-height: 300px;
            object-fit: cover;
            margin-top: 8px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .like-btn {
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .like-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        #recordingStatus {
            font-size: 12px;
            color: #f43f5e;
            margin-bottom: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>LOOP Super App</header>
        
        <div class="content">
            <!-- Features Grid -->
            <div class="features-grid">
                <button class="feature-btn" onclick="alert('ጉዞ (Travel) feature coming soon!')"><span>✈️</span> ጉዞ</button>
                <button class="feature-btn" onclick="alert('ስፖርት (Sports) feature coming soon!')"><span>⚽</span> ስፖርት</button>
                <button class="feature-btn" onclick="alert('ቻት (Chat) feature coming soon!')"><span>💬</span> ቻት</button>
                <button class="feature-btn" onclick="alert('AI ረዳት (AI Assistant) feature coming soon!')"><span>🤖</span> AI ረዳት</button>
                <button class="feature-btn" onclick="alert('ዜና (News) feature coming soon!')"><span>📖</span> ዜና</button>
                <button class="feature-btn" onclick="alert('ዋሌት (Wallet) feature coming soon!')"><span>💰</span> ዋሌት</button>
            </div>

            <!-- Wallet/Account Bar -->
            <div class="wallet-card">
                <div class="balance-badge">0 ETB</div>
                <div class="phone-num">0921324328</div>
                <button class="add-card-btn" onclick="alert('Add card clicked')">+ አድ 💳 ካርድ</button>
            </div>

            <!-- LOOP Family Post Box -->
            <div class="post-box">
                <div class="post-box-title">👥 LOOP Family</div>
                <textarea id="postContent" rows="3" placeholder="ምን እየተሰማዎት ነው?"></textarea>
                <div id="recordingStatus">🔴 ድምጽ በመቅዳት ላይ... (ማቆሚያውን እንደገና ይጫኑ)</div>
                <div class="post-actions">
                    <label class="action-chip">
                        <span>📷</span> ፎቶ/ቪዲዮ <input type="file" id="mediaFile" accept="image/*,video/*" style="display: none;" onchange="fileSelected(this)">
                    </label>
                    <button type="button" class="action-chip" id="voiceBtn" onclick="toggleVoiceRecording()">
                        <span>🎙️</span> <span id="voiceText">ድምጽ</span>
                    </button>
                </div>
                <div id="selectedFileName" style="font-size: 11px; color: #38bdf8; margin-bottom: 8px;"></div>
                <button class="submit-post-btn" id="submitBtn" onclick="createPost()">ለፖረው</button>
            </div>

            <!-- Posts Feed -->
            <div class="feed" id="postsFeed">
                <p style="text-align: center; color: #94a3b8;">ፖስቶች በመጫን ላይ...</p>
            </div>
        </div>
    </div>

    <script>
        // Supabase Credentials (እርስዎን የ Supabase URL እና Anon Key እዚህ ያስገቡ)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;

        function fileSelected(input) {
            const fileNameDiv = document.getElementById('selectedFileName');
            if (input.files && input.files[0]) {
                fileNameDiv.textContent = "የተመረጠ ፋይል: " + input.files[0].name;
                recordedAudioBlob = null; // ፎቶ ሲመረጥ የድምጽ ሬኮርዱን ባዶ እናደርገዋለን
            }
        }

        // ድምጽ የመቅዳት ተግባር (Voice Recording)
        async function toggleVoiceRecording() {
            const voiceText = document.getElementById('voiceText');
            const recordingStatus = document.getElementById('recordingStatus');
            const fileNameDiv = document.getElementById('selectedFileName');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        fileNameDiv.textContent = "የተቀዳ ድምጽ ዝግጁ ነው (Voice Ready)";
                        document.getElementById('mediaFile').value = ''; // ፋይል ሰሌክቱን እናጠፋለን
                    };

                    mediaRecorder.start();
                    voiceText.textContent = "አቁም";
                    recordingStatus.style.display = "block";
                } catch (err) {
                    alert('ማይክሮፎን መጠቀም አልተቻለም: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                voiceText.textContent = "ድምጽ";
                recordingStatus.style.display = "none";
            }
        }

        // ፖስቶችን ከዳታቤዝ ማምጣት
        async function fetchPosts() {
            const feed = document.getElementById('postsFeed');
            
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching posts:', error);
                feed.innerHTML = '<p style="text-align: center; color: #f87171;">ፖስቶችን ማምጣት አልተቻለም።</p>';
                return;
            }

            if (data.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: #94a3b8;">ምንም ፖስቶች የሉም። የመጀመሪያውን ፖስት ያድርጉ!</p>';
                return;
            }

            feed.innerHTML = '';
            data.forEach(post => {
                let mediaElement = '';
                if (post.media_url) {
                    if (post.media_type === 'video') {
                        mediaElement = `<video src="${post.media_url}" controls></video>`;
                    } else if (post.media_type === 'audio') {
                        mediaElement = `<audio src="${post.media_url}" controls></audio>`;
                    } else {
                        mediaElement = `<img src="${post.media_url}" alt="Post Media">`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <p>${escapeHtml(post.content || '')}</p>
                    ${mediaElement}
                    <div class="card-footer">
                        <span>${new Date(post.created_at).toLocaleString()}</span>
                        <button class="like-btn" onclick="likePost(${post.id}, ${post.likes || 0})">❤️ ውደድ (${post.likes || 0})</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // አዲስ ፖስት መፍጠር (ከፋይል ወይም ድምጽ ጋር ወደ Supabase Storage መጫን)
        async function createPost() {
            const contentText = document.getElementById('postContent').value.trim();
            const fileInput = document.getElementById('mediaFile');
            const file = fileInput.files[0];
            const submitBtn = document.getElementById('submitBtn');

            if (!contentText && !file && !recordedAudioBlob) {
                alert('እባክዎ ጽሁፍ፣ ፎቶ/ቪዲዮ ወይም የድምጽ ሬኮርድ ያስገቡ!');
                return;
            }

            submitBtn.textContent = " በመጫን ላይ...";
            submitBtn.disabled = true;

            let mediaUrl = null;
            let mediaType = null;

            try {
                let uploadFile = null;
                if (file) {
                    uploadFile = file;
                    mediaType = file.type.startsWith('video') ? 'video' : 'image';
                } else if (recordedAudioBlob) {
                    uploadFile = new File([recordedAudioBlob], "voice_note.mp3", { type: 'audio/mp3' });
                    mediaType = 'audio';
                }

                if (uploadFile) {
                    const fileName = `${Date.now()}_${uploadFile.name}`;
                    const { data: uploadData, error: uploadError } = await _supabase.storage
                        .from('post-media') // የሱፓቤዝ ስቶሬጅ Bucket ስም (Bucket ስሙን 'post-media' ብለው መፍጠር ይኖርብዎታል)
                        .upload(fileName, uploadFile);

                    if (uploadError) {
                        throw uploadError;
                    }

                    // የፋይሉን ፐብሊክ ዩአርኤል ማግኘት
                    const { data: publicUrlData } = _supabase.storage
                        .from('post-media')
                        .getPublicUrl(fileName);

                    mediaUrl = publicUrlData.publicUrl;
                }

                // ዳታቤዝ ውስጥ ማስገባት
                const { error: dbError } = await _supabase
                    .from('posts')
                    .insert([
                        { 
                            content: contentText, 
                            media_url: mediaUrl, 
                            media_type: mediaType,
                            likes: 0 
                        }
                    ]);

                if (dbError) throw dbError;

                // 폼 ፊልዶቹን ባዶ ማድረግ
                document.getElementById('postContent').value = '';
                if(fileInput) fileInput.value = '';
                document.getElementById('selectedFileName').textContent = '';
                recordedAudioBlob = null;
                fetchPosts();

            } catch (err) {
                alert('ፖስት ማድረግ አልተቻለም: ' + (err.message || err));
                console.error(err);
            } finally {
                submitBtn.textContent = "ለፖረው";
                submitBtn.disabled = false;
            }
        }

        // ላይክ መጨመር
        async function likePost(postId, currentLikes) {
            const { error } = await _supabase
                .from('posts')
                .update({ likes: currentLikes + 1 })
                .eq('id', postId);

            if (!error) {
                fetchPosts();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ገጹ ሲከፈት ፖስቶችን መጫን
        fetchPosts();
    </script>
</body>
</html>
