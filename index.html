<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP Super App</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        /* 1. የስፕላሽ ስክሪን ስታይል (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            animation: spinPulse 2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.4);
        }

        @keyframes spinPulse {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.1) rotate(180deg); opacity: 1; border: 3px solid #4ecca3; }
            100% { transform: scale(0.9) rotate(360deg); opacity: 0.8; }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 2px;
            color: #4ecca3;
            font-weight: bold;
        }

        /* 2. ዋናው አፕሊኬሽን ማዕቀፍ */
        #app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            display: none; /* ስፕላሽ ሲጠናቀቅ ይታያል */
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 14px;
            color: #9ca3af;
        }
        .checkbox-container input {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- የስፕላሽ ስክሪን (በሎጎ እና ሽክርክሪት) -->
    <div id="splash-screen">
        <img src="21185.png" alt="LOOP Logo" class="loader-logo">
        <div class="loader-text">LOOP Super App በመጫን ላይ...</div>
    </div>

    <!-- ዋናው የአፕ ይዘት -->
    <div id="app-container">
        <!-- የሎግኢን ካርድ -->
        <div id="auth-card" class="card">
            <h3 style="margin-top: 0; color: #60a5fa;">🔐 LOOP ደህንነቱ የተጠበቀ መግቢያ</h3>
            <div id="auth-form">
                <input type="email" id="auth-email" placeholder="ኢሜልዎን ያስገቡ" />
                <input type="password" id="auth-password" placeholder="ሚስጥር ቁጥር (Password)" />
                
                <!-- ሎግኢን እንዳይጠይቅ የማስቀመጫ (Remember Me) አማራጭ -->
                <label class="checkbox-container">
                    <input type="checkbox" id="remember-me" checked> ሎግኢን እንዳይጠይቅ አስታውሰኝ (Remember Me)
                </label>

                <button class="btn-primary" onclick="handleLogin()">ግባ (Sign In)</button>
                <button class="btn-success" onclick="handleSignup()">አካውንት ክፈት (Sign Up)</button>
            </div>

            <div id="user-info" style="display: none;">
                <p>እንኳን ደህና መጡ: <span id="user-email-display" style="color: #34d399; font-weight: bold;"></span></p>
                <button class="btn-danger" onclick="handleLogout()">ውጣ (Sign Out)</button>
            </div>
        </div>

        <!-- የፖስት መስጫ ካርድ -->
        <div class="card">
            <h3 style="margin-top: 0; color: #60a5fa;">✍️ ፖስት አድርግ (LOOP Family)</h3>
            <textarea id="post-content" rows="3" placeholder="ምን እየተሰማዎት ነው?"></textarea>
            <input type="file" id="post-media-file" accept="image/*" />
            <button class="btn-primary" onclick="submitPost()">ለቀው (ፖስት አድርግ)</button>
        </div>
    </div>

    <script>
        // Supabase ማዋቀሪያ (የእርስዎን ማስገቢያ ቁልፎች ያስገቡ)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. ስፕላሽ ስክሪኑን ለ 2 ሰከንድ አሳይቶ ወደ ዋናው ገጽ ማሸጋገር
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app-container');
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    app.style.display = 'block';
                    checkExistingSession(); // የተጠቃሚውን የሎግኢን ሁኔታ ማረጋገጥ
                }, 500);
            }, 2000); // 2000 ሚሊሰከንድ (2 ሰከንድ)
        });

        // 2. የተጠቃሚውን ስሺን ማረጋገጥ (Remember Me Logic)
        async function checkExistingSession() {
            // መጀመሪያ ከ LocalStorage ማረጋገጥ
            const savedUser = localStorage.getItem('loop_user_session');
            const { data: { session } } = await supabase.auth.getSession();

            if (session || savedUser) {
                const userEmail = session ? session.user.email : JSON.parse(savedUser).email;
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('user-email-display').textContent = userEmail;
            } else {
                document.getElementById('auth-form').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
            }
        }

        // 3. ሎግኢን ማድረግ
        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!email || !password) {
                alert("እባክዎ ኢሜል እና ፓስወርድ ይሙሉ!");
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("መግባት አልተቻለም: " + error.message);
            } else {
                alert("በሰላም ገብተዋል!");
                // ሎግኢን እንዳይጠይቅ ሴቭ ማድረግ ከተመረጠ
                if (rememberMe) {
                    localStorage.setItem('loop_user_session', JSON.stringify({ email: data.user.email }));
                }
                location.reload();
            }
        }

        // 4. አካውንት መክፈት (Sign Up)
        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("እባክዎ ኢሜል እና ፓስወርድ ይሙሉ!");
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert("ምዝገባ አልተሳካም: " + error.message);
            } else {
                alert("ምዝገባው ተሳክቷል! አሁን መግባት (Sign In) ይችላሉ።");
            }
        }

        // 5. ከሲስተሙ መውጣት (Sign Out)
        async function handleLogout() {
            await supabase.auth.signOut();
            localStorage.removeItem('loop_user_session'); // ሴቭ የተደረገውን ማጥፋት
            alert("ወጥተዋል!");
            location.reload();
        }

        // 6. ጥብቅ የደህንነት መስፈርትን ጠብቆ ፖስት ማድረግ
        async function submitPost() {
            const { data: { user } } = await supabase.auth.getUser();
            const savedUser = localStorage.getItem('loop_user_session');

            if (!user && !savedUser) {
                alert("እባክዎ መጀመሪያ ከላይ በአካውንት ይግቡ (Sign In)!");
                return;
            }

            const content = document.getElementById('post-content').value;
            const fileInput = document.getElementById('post-media-file').files[0];

            if (!content && !fileInput) {
                alert("እባክዎ ጽሁፍ ወይም ፎቶ ያስገቡ!");
                return;
            }

            let mediaUrl = null;

            // ፋይል ካለ ወደ Storage መጫን
            if (fileInput) {
                const fileName = `${Date.now()}_${fileInput.name}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('post-media')
                    .upload(fileName, fileInput);

                if (uploadError) {
                    alert("ፋይል መጫን አልተቻለም: " + uploadError.message);
                    return;
                }

                // የፋይሉን ፐብሊክ ሊንክ ማግኘት
                const { data: publicUrlData } = supabase.storage
                    .from('post-media')
                    .getPublicUrl(fileName);
                
                mediaUrl = publicUrlData.publicUrl;
            }

            // ዳታቤዝ ላይ ፖስቱን ከ user_id ጋር ማስቀመጥ
            const userId = user ? user.id : JSON.parse(savedUser).id;

            const { error: postError } = await supabase
                .from('posts')
                .insert([{ content: content, media_url: mediaUrl, user_id: userId }]);

            if (postError) {
                alert("ፖስት ማድረግ አልተቻለም: " + postError.message);
            } else {
                alert("በተሳካ ሁኔታ ተለጠፈ!");
                document.getElementById('post-content').value = '';
                document.getElementById('post-media-file').value = '';
            }
        }
    </script>
</body>
</html>
