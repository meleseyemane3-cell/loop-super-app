<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP Super App</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        /* የስፕላሽ ስክሪን ስታይል */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #1f2937;
            border-top-color: #4ecca3;
            animation: spin 1s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .spinner-text-inner {
            font-size: 14px;
            font-weight: bold;
            color: #4ecca3;
            letter-spacing: 1px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 16px;
            letter-spacing: 1px;
            color: #4ecca3;
            font-weight: bold;
        }

        /* ዋናው አፕሊኬሽን ማዕቀፍ */
        #app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            display: none;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 14px;
            color: #9ca3af;
        }
        .checkbox-container input {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- የስፕላሽ ስክሪን -->
    <div id="splash-screen">
        <div class="spinner-box">
            <span class="spinner-text-inner">LOOP</span>
        </div>
        <div class="loader-text">LOOP Super App በመጫን ላይ...</div>
    </div>

    <!-- ዋናው የአፕ ይዘት -->
    <div id="app-container">
        <!-- የሎግኢን ካርድ -->
        <div id="auth-card" class="card">
            <h3 style="margin-top: 0; color: #60a5fa;">🔐 LOOP ደህንነቱ የተጠበቀ መግቢያ</h3>
            
            <div id="auth-form">
                <input type="email" id="auth-email" placeholder="ኢሜልዎን ያስገቡ" />
                <input type="password" id="auth-password" placeholder="ሚስጥር ቁጥር (Password)" />
                
                <label class="checkbox-container">
                    <input type="checkbox" id="remember-me" checked> ሎግኢን እንዳይጠይቅ አስታውሰኝ (Remember Me)
                </label>

                <button class="btn-primary" onclick="handleLogin()">ግባ (Sign In)</button>
                <button class="btn-success" onclick="handleSignup()">አካውንት ክፈት (Sign Up)</button>
            </div>

            <div id="user-info" style="display: none;">
                <p>እንኳን ደህና መጡ: <span id="user-email-display" style="color: #34d399; font-weight: bold;"></span></p>
                <button class="btn-danger" onclick="handleLogout()">ውጣ (Sign Out)</button>
            </div>
        </div>

        <!-- የፖስት መስጫ ካርድ -->
        <div class="card">
            <h3 style="margin-top: 0; color: #60a5fa;">✍️ ፖስት አድርግ (LOOP Family)</h3>
            <textarea id="post-content" rows="3" placeholder="ምን እየተሰማዎት ነው?"></textarea>
            <input type="file" id="post-media-file" accept="image/*" />
            <button class="btn-primary" onclick="submitPost()">ለቀው (ፖስት አድርግ)</button>
        </div>
    </div>

    <script>
        // Supabase ደህንነቱ የተጠበቀ አጠቃቀም (Safe Initialization)
        let supabase = null;
        try {
            const SUPABASE_URL = 'YOUR_SUPABASE_URL';
            const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase ማገናኘት አልተቻለም:", e);
        }

        // ስፕላሽ ስክሪኑ በማንኛውም ሁኔታ ከ 2 ሰከንድ በኋላ በሰላም እንዲከፈት የተደረገ አስተማማኝ ትዕዛዝ
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app-container');
                
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        if (app) app.style.display = 'block';
                        
                        // getSession ደህንነቱን ጠብቆ ማስኬድ
                        if (supabase) {
                            checkExistingSession();
                        }
                    }, 500);
                }
            }, 2000);
        });

        // የተጠቃሚውን ስሺን ማረጋገጥ (Remember Me Logic)
        async function checkExistingSession() {
            try {
                const savedUser = localStorage.getItem('loop_user_session');
                const { data: { session } } = await supabase.auth.getSession();

                if (session || savedUser) {
                    const userEmail = session ? session.user.email : JSON.parse(savedUser).email;
                    document.getElementById('auth-form').style.display = 'none';
                    document.getElementById('user-info').style.display = 'block';
                    document.getElementById('user-email-display').textContent = userEmail;
                } else {
                    document.getElementById('auth-form').style.display = 'block';
                    document.getElementById('user-info').style.display = 'none';
                }
            } catch (err) {
                console.error("Session check error:", err);
            }
        }

        // ሎግኢን ማድረግ
        async function handleLogin() {
            if (!supabase) { alert("ሲስተሙ አልተገናኘም!"); return; }
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!email || !password) {
                alert("እባክዎ ኢሜል እና ፓስወርድ ይሙሉ!");
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("መግባት አልተቻለም: " + error.message);
            } else {
                alert("በሰላም ገብተዋል!");
                if (rememberMe) {
                    localStorage.setItem('loop_user_session', JSON.stringify({ id: data.user.id, email: data.user.email }));
                }
                location.reload();
            }
        }

        // አካውንት መክፈት (Sign Up)
        async function handleSignup() {
            if (!supabase) { alert("ሲስተሙ አልተገናኘም!"); return; }
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("እባክዎ ኢሜል እና ፓስወርድ ይሙሉ!");
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert("ምዝገባ አልተሳካም: " + error.message);
            } else {
                alert("ምዝገባው ተሳክቷል! አሁን መግባት (Sign In) ይችላሉ።");
            }
        }

        // ከሲስተሙ መውጣት (Sign Out)
        async function handleLogout() {
            if (supabase) await supabase.auth.signOut();
            localStorage.removeItem('loop_user_session');
            alert("ወጥተዋል!");
            location.reload();
        }

        // ፖስት ማድረግ (Strict RLS)
        async function submitPost() {
            if (!supabase) { alert("ሲስተሙ አልተገናኘም!"); return; }
            const { data: { user } } = await supabase.auth.getUser();
            const savedUser = localStorage.getItem('loop_user_session');

            if (!user && !savedUser) {
                alert("እባክዎ መጀመሪያ ከላይ በአካውንት ይግቡ (Sign In)!");
                return;
            }

            const content = document.getElementById('post-content').value;
            const fileInput = document.getElementById('post-media-file').files[0];

            if (!content && !fileInput) {
                alert("እባክዎ ጽሁፍ ወይም ፎቶ ያስገቡ!");
                return;
            }

            let mediaUrl = null;

            if (fileInput) {
                const fileName = `${Date.now()}_${fileInput.name}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('post-media')
                    .upload(fileName, fileInput);

                if (uploadError) {
                    alert("ፋይል መጫን አልተቻለም: " + uploadError.message);
                    return;
                }

                const { data: publicUrlData } = supabase.storage
                    .from('post-media')
                    .getPublicUrl(fileName);
                
                mediaUrl = publicUrlData.publicUrl;
            }

            const userId = user ? user.id : JSON.parse(savedUser).id;

            const { error: postError } = await supabase
                .from('posts')
                .insert([{ content: content, media_url: mediaUrl, user_id: userId }]);

            if (postError) {
                alert("ፖስት ማድረግ አልተቻለም: " + postError.message);
            } else {
                alert("በተሳካ ሁኔታ ተለጠፈ!");
                document.getElementById('post-content').value = '';
                document.getElementById('post-media-file').value = '';
            }
        }
    </script>
</body>
</html>
