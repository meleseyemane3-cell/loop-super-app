<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOP Super App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.7rem;
            color: #ffffff;
            font-weight: 800;
        }

        header p {
            font-size: 0.8rem;
            color: #8a99ad;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Grid Services Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .service-card {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-card:hover {
            border-color: #ff6b00;
            background-color: #1a233a;
        }

        .service-card .icon {
            font-size: 1.5rem;
        }

        .service-card span {
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
        }

        /* LOOP Family Real Social Section */
        .social-box {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ff6b00;
        }

        .live-btn {
            background: #dc2626;
            color: white;
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-textarea {
            width: 100%;
            background-color: #080c14;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 10px;
            color: #ffffff;
            font-size: 0.85rem;
            resize: none;
            height: 75px;
            outline: none;
        }

        .post-textarea:focus {
            border-color: #ff6b00;
        }

        .post-actions-row {
            display: flex;
            gap: 6px;
        }

        .action-chip {
            flex: 1;
            background-color: #080c14;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 8px 4px;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .action-chip:hover {
            border-color: #ff6b00;
            color: #fff;
        }

        .submit-post-btn {
            width: 100%;
            background: linear-gradient(135deg, #cc3300, #ff6b00);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Feed Display Area */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .feed-card {
            background: #080c14;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feed-user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feed-username {
            font-size: 0.82rem;
            font-weight: bold;
            color: #ff6b00;
        }

        .follow-btn {
            background: rgba(0, 102, 255, 0.2);
            color: #3b82f6;
            border: 1px solid #3b82f6;
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .feed-text {
            font-size: 0.82rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .feed-interactions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1f293d;
            padding-top: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .interaction-action {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .interaction-action:hover {
            color: #ff6b00;
        }

        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }
        .modal-content {
            background: #111827;
            border: 1px solid #ff6b00;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            color: #ff6b00;
        }
        .close-btn {
            background: none; border: none; color: #8a99ad; font-size: 1.2rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>LOOP Super App</h1>
            <p>Connect • Discover • Communicate • Pay</p>
        </header>

        <!-- Services Grid Dashboard -->
        <div class="dashboard-grid">
            <div class="service-card" onclick="openModule('LOOP ቱሪዝም (Tourism & Booking)', 'ኢትዮጵያ ውስጥ የሚገኙ አስደናቂ መስህቦች፣ ሆቴሎች እና የትራንስፖርት ቡኪንግ ስርዓት ከእያንዳንዱ ማብራሪያ ጋር።')">
                <div class="icon">✈️</div>
                <span>LOOP ቱሪዝም</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ስፖርት (Live Match & Scores)', 'የእግር ኳስ ላይቭ ጨዋታዎች፣ ውጤቶች እና ሊግ ሰንጠረዦች በዘመናዊ መልኩ።')">
                <div class="icon">⚽</div>
                <span>ስፖርት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ቻት (AI Translation & Chat)', 'የኢሞ እና ዋትስአፕ ባህሪያት የተሟሉበት፣ በ AI ትርጉም የሚታገዝ አለም አቀፍ የውይይት ማዕቀፍ።')">
                <div class="icon">💬</div>
                <span>ቻት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP AI ረዳት (Smart Assistant)', 'ለማንኛውም ፍላጎትዎ ፈጣን ምላሽ የሚሰጥ እና አፕሊኬሽኑን የሚያስተባብር ስማርት ረዳት።')">
                <div class="icon">🤖</div>
                <span>AI ረዳት</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP ዜና (Multi-sector News)', 'ወቅታዊ ሀገራዊ እና ዓለም አቀፋዊ ባለብዙ ዘርፍ ዜናዎች።')">
                <div class="icon">📖</div>
                <span>ዜና</span>
            </div>
            <div class="service-card" onclick="openModule('LOOP አየር ሁኔታ (Weather)', 'የተለያዩ ከተሞች የአየር ሁኔታ ትንበያ እና ወቅታዊ መረጃዎች።')">
                <div class="icon">🌤️</div>
                <span>አየር ሁኔታ</span>
            </div>
        </div>

        <!-- LOOP Family Real Social Section -->
        <div class="social-box">
            <div class="social-header">
                <span>👥 LOOP Family</span>
                <button class="live-btn" onclick="startLive()">🔴 LIVE ገብ</button>
            </div>
            
            <textarea class="post-textarea" id="postInput" placeholder="ምን እየተሰማዎት ነው? (ጽሁፍ፣ ፎቶ፣ ቪዲዮ ወይም ፋይል ያጋሩ...)"></textarea>
            
            <div class="post-actions-row">
                <div class="action-chip" onclick="attachFile('📷 ፎቶ')">📷 ፎቶ</div>
                <div class="action-chip" onclick="attachFile('🎥 ቪዲዮ')">🎥 ቪዲዮ</div>
                <div class="action-chip" onclick="attachFile('📁 ፋይል')">📁 ፋይል</div>
            </div>

            <button class="submit-post-btn" onclick="submitPost()">ፖስት አድርግ (Post)</button>

            <!-- Live Feed Container -->
            <div class="feed-container" id="feedContainer">
                <div class="feed-card">
                    <div class="feed-user-info">
                        <span class="feed-username">መለሰ ይማነ (Developer)</span>
                        <button class="follow-btn" onclick="toggleFollow(this)">ተከተል (Follow)</button>
                    </div>
                    <div class="feed-text">እንኳን ወደ LOOP Family በደህና መጡ! 🚀 እዚህ ጋር ሀሳብዎን, ፎቶዎችን እና ቪዲዮዎችን ማጋራት, ላይክ እና ኮሜንት መስጠት ይችላሉ።</div>
                    <div class="feed-interactions">
                        <span class="interaction-action" onclick="likePost(this)">❤️ 15 ላይክ</span>
                        <span class="interaction-action" onclick="commentPost()">💬 3 አስተያየት</span>
                        <span class="interaction-action" onclick="sharePost()">🔄 ሼር</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Module Popup View -->
    <div class="modal" id="moduleModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">ማዕቀፍ</span>
                <button class="close-btn" onclick="closeModule()">✕</button>
            </div>
            <p id="modalDesc" style="color: #94a3b8; font-size: 0.88rem; line-height: 1.5;"></p>
            <button class="submit-post-btn" onclick="closeModule()">ተመለስ</button>
        </div>
    </div>

    <script>
        let attachedMedia = "";

        function openModule(name, desc) {
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('moduleModal').style.display = 'flex';
        }
        function closeModule() {
            document.getElementById('moduleModal').style.display = 'none';
        }

        function attachFile(type) {
            attachedMedia = ` [የተያያዘ ፋይል: ${type}]`;
            alert(`${type} ለመጫን ተመርጧል! አሁን ፖስት የሚለውን ይጫኑ።`);
        }

        function startLive() {
            alert('🔴 ቀጥታ ስርጭት (LIVE Stream) ተጀምሯል። ተከታዮችዎ ማሳወቂያ ደርሷቸዋል!');
        }

        function toggleFollow(btn) {
            if(btn.textContent.includes('Follow')) {
                btn.textContent = 'ይከተላሉ (Following)';
                btn.style.background = '#22c55e';
                btn.style.color = '#fff';
                btn.style.borderColor = '#22c55e';
            } else {
                btn.textContent = 'ተከተል (Follow)';
                btn.style.background = 'rgba(0, 102, 255, 0.2)';
                btn.style.color = '#3b82f6';
                btn.style.borderColor = '#3b82f6';
            }
        }

        function likePost(elem) {
            let currentLikes = parseInt(elem.textContent.replace(/[^0-9]/g, '')) || 0;
            elem.textContent = `❤️ ${currentLikes + 1} ላይክ`;
        }

        function commentPost() {
            let comment = prompt("አስተያየትዎን እዚህ ይጻፉ:");
            if(comment) {
                alert("አስተያየትዎ ተሰጥቷል!");
            }
        }

        function sharePost() {
            alert("ፖስቱ በተሳካ ሁኔታ ተጋርቷል (Shared)!");
        }

        function submitPost() {
            const val = document.getElementById('postInput').value.trim();
            if(!val && !attachedMedia) {
                alert('እባክዎ የሚለቁትን ጽሁፍ ወይም ፋይል ይጻፉ!');
                return;
            }
            
            const feedContainer = document.getElementById('feedContainer');
            const newPost = document.createElement('div');
            newPost.className = 'feed-card';
            newPost.innerHTML = `
                <div class="feed-user-info">
                    <span class="feed-username">መለሰ ይማነ (እርስዎ)</span>
                    <button class="follow-btn" onclick="toggleFollow(this)">ተከተል (Follow)</button>
                </div>
                <div class="feed-text">${val} ${attachedMedia}</div>
                <div class="feed-interactions">
                    <span class="interaction-action" onclick="likePost(this)">❤️ 1 ላይክ</span>
                    <span class="interaction-action" onclick="commentPost()">💬 0 አስተያየት</span>
                    <span class="interaction-action" onclick="sharePost()">🔄 ሼር</span>
                </div>
            `;
            feedContainer.prepend(newPost);
            
            alert('ፖስትዎ በ LOOP Family ተሳክቷል!');
            document.getElementById('postInput').value = '';
            attachedMedia = "";
        }
    </script>
</body>
</html>
