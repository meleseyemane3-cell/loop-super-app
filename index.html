<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>LOOP Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 14px;
    }

    .title {
      margin: 10px 0 18px;
      color: #4ade80;
      font-size: 27px;
      font-weight: bold;
      text-align: center;
    }

    .card {
      margin-bottom: 16px;
      padding: 15px;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 14px;
    }

    h2,
    h3 {
      margin-top: 0;
    }

    h2 {
      color: #4ade80;
    }

    h3 {
      color: #60a5fa;
    }

    input,
    textarea {
      width: 100%;
      margin: 6px 0;
      padding: 12px;
      background: #1f2937;
      color: white;
      border: 1px solid #475569;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #4ade80;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .blue {
      background: #2563eb;
    }

    .green {
      background: #059669;
    }

    .red {
      background: #dc2626;
    }

    .orange {
      background: #ea580c;
    }

    .purple {
      background: #7c3aed;
    }

    .hidden {
      display: none !important;
    }

    .auth-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .message {
      min-height: 22px;
      margin-top: 10px;
      color: #4ade80;
      font-size: 13px;
    }

    .error {
      color: #f87171;
    }

    .post {
      margin-bottom: 14px;
      padding: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
    }

    .post-content {
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .post-image,
    .post-video {
      display: block;
      width: 100%;
      max-height: 400px;
      margin-top: 12px;
      border-radius: 10px;
      background: #020617;
      object-fit: contain;
    }

    .post-date {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 11px;
    }

    .social-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .social-actions button {
      width: auto;
      margin: 0;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #475569;
      font-size: 12px;
    }

    .comment-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #334155;
    }

    .comment-box button {
      background: #2563eb;
    }

    .comment-item {
      margin-top: 7px;
      padding: 8px;
      background: #1e293b;
      border-radius: 7px;
      font-size: 13px;
    }

    .user-card {
      margin-bottom: 10px;
      padding: 12px;
      background: #0f172a;
      border-radius: 10px;
    }

    .user-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .user-actions button {
      width: auto;
      margin: 0;
      padding: 8px 10px;
      font-size: 12px;
    }

    .empty {
      padding: 20px;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 430px) {
      .auth-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="title">👥 LOOP Family</div>

    <!-- Authentication -->
    <section class="card">
      <h3>🔐 Login / Sign Up</h3>

      <div id="login-section">
        <input
          id="email"
          type="email"
          placeholder="Email"
        />

        <input
          id="password"
          type="password"
          placeholder="Password"
        />

        <div class="auth-buttons">
          <button
            id="login-btn"
            class="blue"
            type="button"
          >
            ግባ
          </button>

          <button
            id="signup-btn"
            class="green"
            type="button"
          >
            አካውንት ክፈት
          </button>
        </div>

        <div
          id="auth-message"
          class="message"
        ></div>
      </div>

      <div
        id="user-section"
        class="hidden"
      >
        <div>
          ገብተሃል:
          <strong id="user-email"></strong>
        </div>

        <button
          id="logout-btn"
          class="red"
          type="button"
        >
          ውጣ
        </button>
      </div>
    </section>

    <!-- New post -->
    <section
      id="post-section"
      class="card hidden"
    >
      <h2>✍️ አዲስ Post</h2>

      <textarea
        id="post-content"
        placeholder="ምን እያሰብክ ነው?"
      ></textarea>

      <input
        id="media-file"
        type="file"
        accept="image/*,video/*"
      />

      <button
        id="post-btn"
        class="green"
        type="button"
      >
        Post አድርግ
      </button>

      <div
        id="post-message"
        class="message"
      ></div>
    </section>

    <!-- Users -->
    <section
      id="users-section"
      class="card hidden"
    >
      <h2>👥 Users</h2>
      <div id="users-list"></div>
    </section>

    <!-- Posts -->
    <section class="card">
      <h2>📰 Posts</h2>
      <div id="posts-list"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      'YOUR_SUPABASE_URL';

    const SUPABASE_ANON_KEY =
      'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const loginSection =
      document.getElementById(
        'login-section'
      );

    const userSection =
      document.getElementById(
        'user-section'
      );

    const postSection =
      document.getElementById(
        'post-section'
      );

    const usersSection =
      document.getElementById(
        'users-section'
      );

    const userEmail =
      document.getElementById(
        'user-email'
      );

    const authMessage =
      document.getElementById(
        'auth-message'
      );

    const postMessage =
      document.getElementById(
        'post-message'
      );

    const postsList =
      document.getElementById(
        'posts-list'
      );

    const usersList =
      document.getElementById(
        'users-list'
      );

    function showMessage(
      element,
      text,
      error = false
    ) {
      element.textContent = text;
      element.classList.toggle(
        'error',
        error
      );
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function getCurrentUser() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      return user;
    }

    async function requireLogin() {
      const user =
        await getCurrentUser();

      if (!user) {
        alert(
          'ይህን ለማድረግ Login አድርግ።'
        );

        return null;
      }

      return user;
    }

    function renderMedia(post) {
      if (!post.media_url) {
        return '';
      }

      if (post.media_type === 'video') {
        return `
          <video
            class="post-video"
            controls
            src="${post.media_url}"
          ></video>
        `;
      }

      return `
        <img
          class="post-image"
          src="${post.media_url}"
          alt="Post image"
        />
      `;
    }

    async function updateAuthUI() {
      const user =
        await getCurrentUser();

      if (user) {
        loginSection.classList.add(
          'hidden'
        );

        userSection.classList.remove(
          'hidden'
        );

        postSection.classList.remove(
          'hidden'
        );

        usersSection.classList.remove(
          'hidden'
        );

        userEmail.textContent =
          user.email || '';

        await loadUsers();
      } else {
        loginSection.classList.remove(
          'hidden'
        );

        userSection.classList.add(
          'hidden'
        );

        postSection.classList.add(
          'hidden'
        );

        usersSection.classList.add(
          'hidden'
        );
      }
    }

    async function login() {
      const email =
        document
          .getElementById('email')
          .value
          .trim();

      const password =
        document
          .getElementById('password')
          .value;

      if (!email || !password) {
        showMessage(
          authMessage,
          'Email እና Password ሙላ።',
          true
        );

        return;
      }

      const {
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(
          authMessage,
          error.message,
          true
        );

        return;
      }

      showMessage(
        authMessage,
        '✅ Login ተሳክቷል።'
      );

      await updateAuthUI();
      await loadPosts();
    }

    async function signup() {
      const email =
        document
          .getElementById('email')
          .value
          .trim();

      const password =
        document
          .getElementById('password')
          .value;

      if (!email || !password) {
        showMessage(
          authMessage,
          'Email እና Password ሙላ።',
          true
        );

        return;
      }

      const {
        error
      } = await supabaseClient.auth.signUp({
        email,
        password
      });

      if (error) {
        showMessage(
          authMessage,
          error.message,
          true
        );

        return;
      }

      showMessage(
        authMessage,
        '✅ Account ተፈጥሯል። Email ማረጋገጥ ካስፈለገ አረጋግጥ።'
      );
    }

    async function logout() {
      await supabaseClient.auth.signOut();

      await updateAuthUI();
      await loadPosts();
    }

    async function uploadMedia(file, userId) {
      if (!file) {
        return {
          url: null,
          type: null
        };
      }

      const fileName =
        `${userId}/${Date.now()}-${file.name}`;

      const {
        error
      } = await supabaseClient.storage
        .from('post-media')
        .upload(fileName, file);

      if (error) {
        throw error;
      }

      const {
        data
      } = supabaseClient.storage
        .from('post-media')
        .getPublicUrl(fileName);

      const type =
        file.type.startsWith('video/')
          ? 'video'
          : 'image';

      return {
        url: data.publicUrl,
        type
      };
    }

    async function createPost() {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const content =
        document
          .getElementById('post-content')
          .value
          .trim();

      const file =
        document
          .getElementById('media-file')
          .files[0];

      if (!content && !file) {
        showMessage(
          postMessage,
          'Text ወይም image/video አስገባ።',
          true
        );

        return;
      }

      try {
        showMessage(
          postMessage,
          'በመላክ ላይ...'
        );

        const media =
          await uploadMedia(
            file,
            user.id
          );

        const {
          error
        } = await supabaseClient
          .from('posts')
          .insert({
            user_id: user.id,
            content: content || null,
            media_url: media.url,
            media_type: media.type
          });

        if (error) {
          throw error;
        }

        document
          .getElementById('post-content')
          .value = '';

        document
          .getElementById('media-file')
          .value = '';

        showMessage(
          postMessage,
          '✅ Post ተልኳል።'
        );

        await loadPosts();
      } catch (error) {
        showMessage(
          postMessage,
          error.message,
          true
        );
      }
    }

    async function loadPosts() {
      postsList.innerHTML =
        '<div class="empty">Posts በመጫን ላይ...</div>';

      const {
        data: posts,
        error
      } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', {
          ascending: false
        });

      if (error) {
        postsList.innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message)}
          </div>
        `;

        return;
      }

      if (!posts || posts.length === 0) {
        postsList.innerHTML =
          '<div class="empty">እስካሁን Post የለም።</div>';

        return;
      }

      postsList.innerHTML = '';

      for (const post of posts) {
        await renderPost(post);
      }
    }

    async function renderPost(post) {
      const {
        count: likeCount
      } = await supabaseClient
        .from('post_likes')
        .select('*', {
          count: 'exact',
          head: true
        })
        .eq('post_id', post.id);

      const {
        count: commentCount
      } = await supabaseClient
        .from('comments')
        .select('*', {
          count: 'exact',
          head: true
        })
        .eq('post_id', post.id);

      const {
        count: shareCount
      } = await supabaseClient
        .from('post_shares')
        .select('*', {
          count: 'exact',
          head: true
        })
        .eq('post_id', post.id);

      const element =
        document.createElement('article');

      element.className = 'post';

      element.innerHTML = `
        <div class="post-content">
          ${escapeHtml(post.content || '')}
        </div>

        ${renderMedia(post)}

        <div class="post-date">
          ${new Date(post.created_at)
            .toLocaleString('am-ET')}
        </div>

        <div class="social-actions">
          <button
            class="like-btn"
            type="button"
          >
            ❤️ Like ${likeCount || 0}
          </button>

          <button
            class="comment-btn"
            type="button"
          >
            💬 Comment ${commentCount || 0}
          </button>

          <button
            class="share-btn"
            type="button"
          >
            🔁 Share ${shareCount || 0}
          </button>
        </div>

        <div
          id="comment-box-${post.id}"
          class="comment-box hidden"
        >
          <input
            id="comment-input-${post.id}"
            type="text"
            placeholder="Comment ጻፍ..."
          />

          <button
            class="send-comment-btn"
            type="button"
          >
            Comment ላክ
          </button>

          <div
            id="comments-${post.id}"
          ></div>
        </div>
      `;

      postsList.appendChild(element);

      element
        .querySelector('.like-btn')
        .addEventListener('click', () => {
          toggleLike(post.id);
        });

      element
        .querySelector('.comment-btn')
        .addEventListener('click', () => {
          toggleComments(post.id);
        });

      element
        .querySelector('.share-btn')
        .addEventListener('click', () => {
          sharePost(post.id);
        });

      element
        .querySelector('.send-comment-btn')
        .addEventListener('click', () => {
          const input =
            document.getElementById(
              `comment-input-${post.id}`
            );

          addComment(post.id, input);
        });
    }

    async function toggleLike(postId) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const {
        data: oldLike,
        error: findError
      } = await supabaseClient
        .from('post_likes')
        .select('id')
        .eq('post_id', postId)
        .eq('user_id', user.id)
        .maybeSingle();

      if (findError) {
        alert(findError.message);
        return;
      }

      if (oldLike) {
        const {
          error
        } = await supabaseClient
          .from('post_likes')
          .delete()
          .eq('id', oldLike.id);

        if (error) {
          alert(error.message);
          return;
        }
      } else {
        const {
          error
        } = await supabaseClient
          .from('post_likes')
          .insert({
            post_id: postId,
            user_id: user.id
          });

        if (error) {
          alert(error.message);
          return;
        }
      }

      await loadPosts();
    }

    async function toggleComments(postId) {
      const box =
        document.getElementById(
          `comment-box-${postId}`
        );

      if (!box) {
        return;
      }

      box.classList.toggle('hidden');

      if (
        !box.classList.contains('hidden')
      ) {
        await loadComments(postId);
      }
    }

    async function loadComments(postId) {
      const list =
        document.getElementById(
          `comments-${postId}`
        );

      const {
        data,
        error
      } = await supabaseClient
        .from('comments')
        .select('content, created_at')
        .eq('post_id', postId)
        .order('created_at', {
          ascending: true
        });

      if (error) {
        list.innerHTML = `
          <div class="comment-item">
            ${escapeHtml(error.message)}
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = `
          <div class="comment-item">
            Comment የለም።
          </div>
        `;

        return;
      }

      list.innerHTML = data
        .map(comment => `
          <div class="comment-item">
            ${escapeHtml(comment.content)}
          </div>
        `)
        .join('');
    }

    async function addComment(
      postId,
      input
    ) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const content =
        input.value.trim();

      if (!content) {
        alert('Comment ጻፍ።');
        return;
      }

      const {
        error
      } = await supabaseClient
        .from('comments')
        .insert({
          post_id: postId,
          user_id: user.id,
          content
        });

      if (error) {
        alert(error.message);
        return;
      }

      input.value = '';

      await loadComments(postId);
      await loadPosts();
    }

    async function sharePost(postId) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from('post_shares')
        .insert({
          post_id: postId,
          user_id: user.id
        });

      if (
        error &&
        !error.message
          .toLowerCase()
          .includes('duplicate')
      ) {
        alert(error.message);
        return;
      }

      const url =
        `${window.location.origin}` +
        `${window.location.pathname}` +
        `?post=${postId}`;

      try {
        if (navigator.share) {
          await navigator.share({
            title: 'LOOP Family Post',
            text: 'LOOP Family ላይ ይህን Post ተመልከት',
            url
          });
        } else {
          await navigator.clipboard
            .writeText(url);

          alert(
            'የPost link ተቀድቷል።'
          );
        }
      } catch {
        console.log(
          'Share cancelled'
        );
      }

      await loadPosts();
    }

    async function loadUsers() {
      const currentUser =
        await getCurrentUser();

      if (!currentUser) {
        return;
      }

      const {
        data: users,
        error
      } = await supabaseClient
        .from('profiles')
        .select('id, username, full_name')
        .neq('id', currentUser.id)
        .limit(30);

      if (error) {
        usersList.innerHTML = `
          <div class="empty">
            profiles table አልተገኘም።
          </div>
        `;

        return;
      }

      if (!users || users.length === 0) {
        usersList.innerHTML =
          '<div class="empty">ሌላ User የለም።</div>';

        return;
      }

      usersList.innerHTML = '';

      for (const user of users) {
        const card =
          document.createElement('div');

        card.className = 'user-card';

        const name =
          user.full_name ||
          user.username ||
          'User';

        card.innerHTML = `
          <strong>
            ${escapeHtml(name)}
          </strong>

          <div class="user-actions">
            <button
              class="friend-btn"
              type="button"
            >
              👥 Add Friend
            </button>

            <button
              class="follow-btn"
              type="button"
            >
              ➕ Follow
            </button>

            <button
              class="subscribe-btn"
              type="button"
            >
              🔔 Subscribe
            </button>
          </div>
        `;

        usersList.appendChild(card);

        card
          .querySelector('.friend-btn')
          .addEventListener('click', () => {
            addFriend(user.id);
          });

        card
          .querySelector('.follow-btn')
          .addEventListener('click', () => {
            toggleFollow(user.id);
          });

        card
          .querySelector('.subscribe-btn')
          .addEventListener('click', () => {
            toggleSubscribe(user.id);
          });
      }
    }

    async function addFriend(receiverId) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from('friend_requests')
        .insert({
          sender_id: user.id,
          receiver_id: receiverId,
          status: 'pending'
        });

      if (error) {
        alert(
          error.message
            .toLowerCase()
            .includes('duplicate')
            ? 'Friend request ቀድሞ ተልኳል።'
            : error.message
        );

        return;
      }

      alert(
        '✅ Friend request ተልኳል።'
      );
    }

    async function toggleFollow(
      targetUserId
    ) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const {
        data: oldFollow,
        error: findError
      } = await supabaseClient
        .from('follows')
        .select('id')
        .eq('follower_id', user.id)
        .eq('following_id', targetUserId)
        .maybeSingle();

      if (findError) {
        alert(findError.message);
        return;
      }

      if (oldFollow) {
        const {
          error
        } = await supabaseClient
          .from('follows')
          .delete()
          .eq('id', oldFollow.id);

        if (error) {
          alert(error.message);
          return;
        }

        alert('Unfollow ተደርጓል።');
      } else {
        const {
          error
        } = await supabaseClient
          .from('follows')
          .insert({
            follower_id: user.id,
            following_id: targetUserId
          });

        if (error) {
          alert(error.message);
          return;
        }

        alert('✅ Follow ተደርጓል።');
      }
    }

    async function toggleSubscribe(
      creatorId
    ) {
      const user =
        await requireLogin();

      if (!user) {
        return;
      }

      const {
        data: oldSubscription,
        error: findError
      } = await supabaseClient
        .from('subscriptions')
        .select('id')
        .eq('subscriber_id', user.id)
        .eq('creator_id', creatorId)
        .maybeSingle();

      if (findError) {
        alert(findError.message);
        return;
      }

      if (oldSubscription) {
        const {
          error
        } = await supabaseClient
          .from('subscriptions')
          .delete()
          .eq('id', oldSubscription.id);

        if (error) {
          alert(error.message);
          return;
        }

        alert(
          'Subscription ተሰርዟል።'
        );
      } else {
        const {
          error
        } = await supabaseClient
          .from('subscriptions')
          .insert({
            subscriber_id: user.id,
            creator_id: creatorId
          });

        if (error) {
          alert(error.message);
          return;
        }

        alert(
          '✅ Subscribe ተደርጓል።'
        );
      }
    }

    document
      .getElementById('login-btn')
      .addEventListener(
        'click',
        login
      );

    document
      .getElementById('signup-btn')
      .addEventListener(
        'click',
        signup
      );

    document
      .getElementById('logout-btn')
      .addEventListener(
        'click',
        logout
      );

    document
      .getElementById('post-btn')
      .addEventListener(
        'click',
        createPost
      );

    supabaseClient.auth.onAuthStateChange(
      async () => {
        await updateAuthUI();
        await loadPosts();
      }
    );

    updateAuthUI();
    loadPosts();
  </script>
